name: Tailwind CSS
package: "@steno/plugin-tailwind"
label: Styles
description: >-
  Compiles Tailwind utility classes used in your content and templates during
  the build. Run it isolated since it shells out to a bundler and does not
  need filesystem access beyond its own output.
install: "jsr:@steno/plugin-tailwind"
sourceUrl: https://jsr.io/@steno/plugin-tailwind
