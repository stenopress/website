official:
  - name: Tailwind CSS
    package: "@steno/plugin-tailwind"
    label: Styles
    description: Compiles Tailwind utility classes used in your content and templates during the build. Run it isolated since it shells out to a bundler and does not need filesystem access beyond its own output.
    install: "jsr:@steno/plugin-tailwind"
    sourceUrl: https://jsr.io/@steno/plugin-tailwind
  - name: Shiki syntax highlighting
    package: "@steno/plugin-shiki"
    label: Code
    description: Highlights fenced code blocks with the same grammars and themes as VS Code, applied as an HTML transform on page and collection content.
    install: "jsr:@steno/plugin-shiki"
    sourceUrl: https://jsr.io/@steno/plugin-shiki
  - name: SEO
    package: "@steno/plugin-seo"
    label: SEO
    description: Generates a sitemap, RSS and Atom feeds, and robots.txt from your site's pages during afterBuild.
    install: "jsr:@steno/plugin-seo"
    sourceUrl: https://jsr.io/@steno/plugin-seo
  - name: Docs sync
    package: "@steno/plugin-docs"
    label: Content
    description: Mirrors markdown from an external directory (like a repo-root docs/ folder) into contentDir before each build, rewriting relative links to routes.
    install: "jsr:@steno/plugin-docs"
    sourceUrl: https://jsr.io/@steno/plugin-docs
  - name: Search index
    package: "@steno/plugin-search"
    label: Search
    description: Generates a JSON search index from your site's rendered HTML, ready for a client-side search UI.
    install: "jsr:@steno/plugin-search"
    sourceUrl: https://jsr.io/@steno/plugin-search
  - name: OG image generation
    package: "@steno/plugin-og"
    label: SEO
    description: Auto-generates an SVG Open Graph preview image per page and injects the og:image meta tags, skipping pages that already declare their own.
    install: "jsr:@steno/plugin-og"
    sourceUrl: https://jsr.io/@steno/plugin-og
community: []
