title: "Steno"
description: "A fast, configurable static site generator powered by Deno."
author: "Steno contributors"

plugins:
  - package: "jsr:@steno/plugin-docs@^0.1.0"
    mode: trusted
    options:
      sourceDir: "docs-source"
      descriptionTemplate: "{title}, from the Steno documentation."
  - package: "jsr:@steno/plugin-search@^0.2.0"
    mode: trusted
    options:
      indexPath: "assets/docs-search.json"
      include:
        - /docs/
  - package: "jsr:@steno/plugin-shiki@1.0.1"
    mode: trusted
    options:
      theme: "kanagawa-wave"

contentDir: "content"
output: "dist"

shortUrls: true
theme: "./theme"
themeConfig:
  contentDriven: true
  githubUrl: "https://github.com/stenopress/steno"
  jsrUrl: "https://jsr.io/@steno/steno"
